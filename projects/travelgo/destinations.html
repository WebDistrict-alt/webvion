<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destinations — TravelGo</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="destinations">
<main class="wrap">
  <header class="page-head">
    <h1>Destinations</h1>
    <p>Nine places our travellers love, from neon cities to arctic fjords. Filter by season and budget, or switch to the map.</p>
  </header>

  <div class="catalog">
    <aside class="filters" id="filters" aria-label="Filters">
      <h3>Filters <button class="icon-btn close-f" type="button" aria-label="Close filters" data-close-f><span data-ic="x"></span></button></h3>
      <label class="field"><span>Search</span><input class="input" id="f-q" placeholder="Tokyo, beach, Japan…"></label>
      <div class="f-group"><span class="label">Continent</span><div class="chips" id="f-continent"></div></div>
      <label class="field"><span class="label" style="color:var(--text);font-weight:600;font-size:14px">Country</span><select class="select" id="f-country"><option value="">All countries</option></select></label>
      <div class="f-group"><span class="label">Trip type</span><div class="chips" id="f-type"></div></div>
      <div class="f-group"><span class="label">Budget for 7 days</span>
        <input type="range" id="f-budget" min="1000" max="5000" step="100" value="5000" aria-label="Maximum budget">
        <div class="range-out"><span>$1,000</span><span>up to <b id="f-budget-out">$5,000</b></span></div></div>
      <div class="f-group"><span class="label">Best season</span><div class="chips" id="f-season"></div></div>
      <button class="btn btn-ghost btn-sm" type="button" id="f-reset">Clear filters</button>
    </aside>

    <section aria-label="Results">
      <div class="toolbar">
        <p class="count" aria-live="polite"><b id="count">9</b> destinations</p>
        <div class="toolbar-right">
          <button class="btn btn-ghost btn-sm filter-toggle" type="button" data-open-f><span data-ic="sliders"></span>Filters</button>
          <select class="select" id="sort" aria-label="Sort" style="min-height:40px;width:auto"><option value="pop">Most popular</option><option value="low">Budget: low to high</option><option value="high">Budget: high to low</option><option value="az">Name A–Z</option></select>
          <div class="seg" role="group" aria-label="View">
            <button type="button" aria-pressed="true" data-view="grid"><span data-ic="grid"></span>Grid</button>
            <button type="button" aria-pressed="false" data-view="map"><span data-ic="map"></span>Map</button>
          </div>
        </div>
      </div>
      <div class="grid grid-3" id="results"></div>
      <div class="map-shell" id="map-wrap" hidden><div class="map-canvas" id="map" style="height:640px"></div></div>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  const TYPES = { city: 'City', beach: 'Beach', nature: 'Nature', adventure: 'Adventure', food: 'Food', culture: 'Culture', wellness: 'Wellness' };
  const SEASONS = { spring: 'Spring', summer: 'Summer', autumn: 'Autumn', winter: 'Winter' };
  const CONTINENTS = [...new Set(DESTINATIONS.map((d) => d.continent))];
  const state = { q: qs('q') || '', continent: '', country: '', types: new Set(qs('type') ? [qs('type')] : []), budget: +(qs('budget') || 5000), seasons: new Set(), sort: 'pop', view: 'grid' };

  const chip = (val, label, on) => `<button type="button" class="chip" data-v="${val}" aria-pressed="${on}">${label}</button>`;
  function drawChips() {
    $('#f-continent').innerHTML = chip('', 'All', !state.continent) + CONTINENTS.map((c) => chip(c, c, state.continent === c)).join('');
    $('#f-type').innerHTML = Object.entries(TYPES).map(([k, l]) => chip(k, l, state.types.has(k))).join('');
    $('#f-season').innerHTML = Object.entries(SEASONS).map(([k, l]) => chip(k, l, state.seasons.has(k))).join('');
  }
  $('#f-country').innerHTML += [...new Set(DESTINATIONS.map((d) => d.country))].sort().map((c) => `<option>${c}</option>`).join('');
  $('#f-q').value = state.q;
  $('#f-budget').value = state.budget;

  function filtered() {
    const q = state.q.trim().toLowerCase();
    let list = DESTINATIONS.filter((d) =>
      (!q || [d.name, d.country, d.continent, ...d.types].join(' ').toLowerCase().includes(q)) &&
      (!state.continent || d.continent === state.continent) &&
      (!state.country || d.country === state.country) &&
      (!state.types.size || d.types.some((t) => state.types.has(t))) &&
      d.budget <= state.budget &&
      (!state.seasons.size || d.season.some((s) => state.seasons.has(s))));
    if (state.sort === 'low') list.sort((a, b) => a.budget - b.budget);
    if (state.sort === 'high') list.sort((a, b) => b.budget - a.budget);
    if (state.sort === 'az') list.sort((a, b) => a.name.localeCompare(b.name));
    return list;
  }

  let map, layer;
  function render() {
    const list = filtered();
    $('#count').textContent = list.length;
    $('#f-budget-out').textContent = money(state.budget);
    $('#results').innerHTML = list.length ? list.map(destCard).join('') :
      `<div class="empty" style="grid-column:1/-1"><b>No destinations match these filters</b>Raise the budget or remove a trip type to see more places.<br><button class="btn btn-ghost btn-sm" data-reset>Clear filters</button></div>`;
    if (state.view === 'map') drawMap(list);
  }
  function drawMap(list) {
    if (!map) { map = makeMap('map', { center: [30, 40], zoom: 2, scroll: true }); layer = L.layerGroup().addTo(map); }
    layer.clearLayers();
    list.forEach((d) => {
      L.marker([d.lat, d.lng], { icon: pinIcon(false), title: d.name }).addTo(layer)
        .bindTooltip(d.name, { direction: 'top', offset: [0, -10], className: 'pin-label' })
        .bindPopup(`<div class="pop" style="width:220px">
          <img src="${U(d.img, 440)}" alt="">
          <b>${d.name}</b><span>${d.country}, from ${money(d.budget)}</span><br>
          <a href="destination.html?id=${d.id}">Explore ${d.name}</a></div>`);
    });
    setTimeout(() => map.invalidateSize(), 50);
    if (list.length) map.fitBounds(list.map((d) => [d.lat, d.lng]), { padding: [60, 60], maxZoom: 5 });
  }

  function onChip(container, fn) { container.addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (!c) return; fn(c.dataset.v); drawChips(); render(); }); }
  onChip($('#f-continent'), (v) => { state.continent = v; });
  onChip($('#f-type'), (v) => { state.types.has(v) ? state.types.delete(v) : state.types.add(v); });
  onChip($('#f-season'), (v) => { state.seasons.has(v) ? state.seasons.delete(v) : state.seasons.add(v); });
  $('#f-q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  $('#f-country').addEventListener('change', (e) => { state.country = e.target.value; render(); });
  $('#f-budget').addEventListener('input', (e) => { state.budget = +e.target.value; render(); });
  $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
  function reset() { Object.assign(state, { q: '', continent: '', country: '', budget: 5000 }); state.types.clear(); state.seasons.clear(); $('#f-q').value = ''; $('#f-country').value = ''; $('#f-budget').value = 5000; drawChips(); render(); }
  $('#f-reset').onclick = reset;
  document.addEventListener('click', (e) => { if (e.target.closest('[data-reset]')) reset(); });

  $$('[data-view]').forEach((b) => b.addEventListener('click', () => {
    state.view = b.dataset.view;
    $$('[data-view]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    $('#results').hidden = state.view === 'map';
    $('#map-wrap').hidden = state.view !== 'map';
    render();
  }));
  $('[data-open-f]').onclick = () => $('#filters').classList.add('is-open');
  $('[data-close-f]').onclick = () => $('#filters').classList.remove('is-open');

  drawChips();
  render();
</script>
</body>
</html>
